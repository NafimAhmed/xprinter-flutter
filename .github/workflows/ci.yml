name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile Android plugin in a host app
        run: |
          flutter create --platforms=android /tmp/xprinter_host
          cd /tmp/xprinter_host
          flutter pub add xprinter_flutter --path "$GITHUB_WORKSPACE"
          flutter build apk --debug
