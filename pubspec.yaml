name: xprinter_flutter
description: Direct Android printing for XPrinter label and POS printers over Bluetooth, TCP/IP, and USB with TSPL, ZPL, CPCL, and ESC/POS support.
version: 0.1.0
homepage: https://github.com/NafimAhmed/xprinter-flutter
repository: https://github.com/NafimAhmed/xprinter-flutter
issue_tracker: https://github.com/NafimAhmed/xprinter-flutter/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nafimahmed.xprinter_flutter
        pluginClass: XprinterFlutterPlugin
